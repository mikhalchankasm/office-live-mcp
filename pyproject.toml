[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-live-mcp"
version = "0.2.0"
description = "MCP server that lets any AI agent drive OPEN Microsoft Excel and Word documents (live COM automation)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pywin32>=306; sys_platform == 'win32'",
    "olefile>=0.47",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
office-live-mcp = "office_live.__main__:main"

[tool.setuptools.packages.find]
include = ["office_live*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 180
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]
