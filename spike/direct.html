<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local server test</title>
<style>body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#1f2328;background:#fff}
button{font:inherit;padding:6px 14px;border:0;border-radius:4px;background:#217346;color:#fff;cursor:pointer}
#log{margin-top:12px;font:12px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-word}.ok{color:#145c2e}.bad{color:#b42318}.dim{color:#777}</style></head>
<body><h1>Проверка без Excel: обычная страница → сервер на компьютере</h1>
<p>Та же проверка, что в надстройке, но страница открыта напрямую, без Excel.</p>
<button id="run">Проверить</button><div id="log"></div>
<script src="diag.js?v=2"></script>
<script>
const box=document.getElementById("log");
function log(t,c){const d=document.createElement("div");if(c)d.className=c;d.textContent=new Date().toLocaleTimeString()+"  "+t;box.appendChild(d);}
document.getElementById("run").onclick=async()=>{
  box.textContent="";
  log("Браузер: "+navigator.userAgent,"dim");
  for(const n of ["local-network-access","local-network","loopback-network"]){
    try{log(`разрешение ${n}: ${(await navigator.permissions.query({name:n})).state}`,"dim");}catch(e){log(`разрешение ${n}: не поддерживается`,"dim");}
  }
  await diagFetchVariants(log);
  const ws=await diagSocket(log);
  if(ws){ws.send(JSON.stringify({type:"hello",ua:navigator.userAgent,origin:location.origin,direct:true}));log("WebSocket работает — сервер получил приветствие.","ok");setTimeout(()=>ws.close(),500);}
};
</script></body></html>
