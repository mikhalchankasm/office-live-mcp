[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "office-live-mcp"
version = "0.4.2"
description = "MCP server that lets any AI agent drive OPEN Microsoft Excel and Word documents (live COM automation)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mikhalchankasm" }]
keywords = ["mcp", "model-context-protocol", "excel", "word", "microsoft-office", "com", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "mcp>=2.3,<3",
    "pywin32>=306; sys_platform == 'win32'",
    "olefile>=0.47",
    "pillow>=10",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/mikhalchankasm/office-live-mcp"
Issues = "https://github.com/mikhalchankasm/office-live-mcp/issues"
Changelog = "https://github.com/mikhalchankasm/office-live-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
office-live-mcp = "office_live.__main__:main"

[tool.setuptools.packages.find]
include = ["office_live*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 180
target-version = "py310"

[tool.ruff.lint]
# F — ошибки (неопределённые имена и т. п.), E9 — синтаксис, W — пробелы, B — типичные ловушки, UP — устаревший синтаксис, PLE — ошибки pylint
select = ["F", "E9", "W", "B", "UP", "PLE"]
