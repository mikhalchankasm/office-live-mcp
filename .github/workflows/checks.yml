name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:  # ручной запуск: Actions -> CI -> Run workflow (или gh workflow run checks.yml)

jobs:
  checks:
    # COM-автоматизация есть только в Windows; живые тесты (нужны настоящие Excel/Word) в CI не запускаются
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
      - name: Lint
        run: python -m ruff check .
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Server starts and lists tools
        run: python -m pytest tests/test_stdio.py -q

  package:
    # автономный архив для «пустой» машины: office-live-mcp.exe (Python внутри) + install.cmd
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write  # прикрепить архив к релизу при теге v*
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
      - name: Build and smoke-test the archive
        run: python packaging/build.py
      - name: Packaged lifecycle acceptance on an isolated profile (no Office calls)
        run: python -m pytest tests/test_acceptance.py -q
      - uses: actions/upload-artifact@v7
        with:
          name: office-live-mcp-win64
          path: dist/office-live-mcp-*-win64.zip
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash  # pwsh не раскрывает * для внешних программ
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/office-live-mcp-*-win64.zip --title "${{ github.ref_name }}" --generate-notes
