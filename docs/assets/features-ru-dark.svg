<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Свой агент и модель: Ваши инструкции и порядок работы. Любая модель вашего MCP-клиента.; Excel → Word → PDF: Документ на каждую строку реестра по шаблону, с предпросмотром.; Доступ под контролем: Только чтение, разрешённые папки, наборы — проверяет сервер.; Правки сразу видны: Работа в открытых документах, включая несохранённые правки.; Просмотр и отмена: Правки Word через исправления. Журнал и отмена с проверкой.; Бесплатно и открыто: Без подписки на сервер, код MIT. Один установщик, без прав админа."><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity="0.12"/></filter></defs><g filter="url(#sh)"><rect x="8" y="8" width="376" height="176" rx="16" fill="#1c2129" stroke="#30363d"/></g><rect x="32" y="32" width="52" height="52" rx="14" fill="#8a73e6" fill-opacity="0.12"/><path fill="none" stroke="#8a73e6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M46 49 h24 a3 3 0 0 1 3 3 v12 a3 3 0 0 1 -3 3 h-12 l-7 6 v-6 h-5 a3 3 0 0 1 -3 -3 v-12 a3 3 0 0 1 3 -3 z"/><circle cx="53" cy="58" r="1.6" fill="#8a73e6"/><circle cx="59" cy="58" r="1.6" fill="#8a73e6"/><circle cx="65" cy="58" r="1.6" fill="#8a73e6"/><text x="100" y="66" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f0f6fc" text-anchor="start">Свой агент и модель</text><text x="32" y="124" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9198a1" text-anchor="start">Ваши инструкции и порядок работы.</text><text x="32" y="151" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#9198a1" text-anchor="start">Любая модель вашего MCP-клиента.</text><g filter="url(#sh)"><rect x="400" y="8" width="