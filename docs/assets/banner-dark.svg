<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Office Live MCP</title>
  <desc id="d">Your AI agent in the Excel and Word files you already have open</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#5b3fd6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="none" stroke="#30363d"/>

  <!-- connection lines -->
  <path d="M146 92 C 210 92, 220 150, 262 150" fill="none" stroke="#3fa66b" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
  <path d="M146 208 C 210 208, 220 150, 262 150" fill="none" stroke="#5b8ad6" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>

  <!-- Excel tile -->
  <rect x="62" y="50" width="84" height="84" rx="18" fill="#217346"/>
  <text x="104" y="108" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">X</text>
  <!-- Word tile -->
  <rect x="62" y="166" width="84" height="84" rx="18" fill="#2b579a"/>
  <text x="104" y="224" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">W</text>
  <!-- Agent node -->
  <circle cx="300" cy="150" r="42" fill="url(#agent)"/>
  <path d="M282 140 h36 a6 6 0 0 1 6 6 v14 a6 6 0 0 1 -6 6 h-18 l-10 9 v-9 h-8 a6 6 0 0 1 -6 -6 v-14 a6 6 0 0 1 6 -6 z" fill="#ffffff"/>
  <circle cx="290" cy="153" r="3" fill="#5b3fd6"/>
  <circle cx="300" cy="153" r="3" fill="#5b3fd6"/>
  <circle cx="310" cy="153" r="3" fill="#5b3fd6"/>

  <!-- Title and tagline -->
  <text x="392" y="132" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#f0f6fc">Office Live MCP</text>
  <text x="394" y="178" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="25" fill="#9198a1">Your AI agent in the Excel and Word files you already have open</text>

  <!-- Pills -->
  <g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="394" y="208" width="144" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="466" y="230" text-anchor="middle" fill="#a991ff">Any MCP agent</text>
    <rect x="550" y="208" width="184" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="642" y="230" text-anchor="middle" fill="#5fc28a">Live Excel &amp; Word</text>
    <rect x="746" y="208" width="166" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="829" y="230" text-anchor="middle" fill="#79a7ef">Preview &amp; undo</text>
    <rect x="924" y="208" width="122" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="985" y="230" text-anchor="middle" fill="#c9d1d9">Free · MIT</text>
  </g>
</svg>
